<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة التعليمية الشاملة في مصر</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Top Navigation Bar -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <i class="fa-solid fa-graduation-cap text-3xl text-yellow-400"></i>
                <h1 class="text-xl font-bold">منصة تعليم مصر (27 محافظة)</h1>
            </div>
            <div class="flex items-center space-x-3 space-x-reverse">
                <button onclick="switchTab('admin')" id="nav-admin" class="bg-yellow-500 hover:bg-yellow-600 text-indigo-950 px-3 py-1.5 rounded-lg text-sm font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-user-shield"></i> لوحة الأدمن
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- 3 Main Tabs Switcher -->
        <div class="flex border-b border-gray-300 bg-white rounded-t-xl shadow-sm overflow-hidden">
            <button onclick="switchTab('student')" id="tab-student" class="flex-1 py-3 px-4 text-center font-bold text-sm text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-graduate"></i> بوابة الطلاب
            </button>
            <button onclick="switchTab('teacher')" id="tab-teacher" class="flex-1 py-3 px-4 text-center font-bold text-sm text-gray-600 hover:text-indigo-600 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-chalkboard-user"></i> بوابة المعلمين
            </button>
            <button onclick="switchTab('parent')" id="tab-parent" class="flex-1 py-3 px-4 text-center font-bold text-sm text-gray-600 hover:text-indigo-600 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-group"></i> بوابة أولياء الأمور
            </button>
        </div>

        <!-- TAB CONTENT 1: Student Portal -->
        <div id="content-student" class="tab-content space-y-6">
            <section class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-map-location-dot text-indigo-600"></i> فلترة المحافظات والمراحل الدراسية
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">اختر المحافظة (27 محافظة)</label>
                        <select class="w-full border rounded-lg p-2.5 text-sm bg-gray-50">
                            <option value="">جميع المحافظات المصرية</option>
                            <option>القاهرة</option><option>الإسكندرية</option><option>الجيزة</option><option>الدقهلية</option><option>الشرقية</option><option>المنوفية</option><option>الغربية</option><option>القليوبية</option><option>البحيرة</option><option>كفر الشيخ</option><option>دمياط</option><option>بورسعيد</option><option>الإسماعيلية</option><option>السويس</option><option>شمال سيناء</option><option>جنوب سيناء</option><option>الفيوم</option><option>بني سويف</option><option>المنيا</option><option>أسيوط</option><option>سوهاج</option><option>قنا</option><option>الأقصر</option><option>أسوان</option><option>البحر الأحمر</option><option>الوادي الجديد</option><option>مطروح</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">اختر المرحلة التعليمية</label>
                        <select class="w-full border rounded-lg p-2.5 text-sm bg-gray-50">
                            <option value="">جميع المراحل</option>
                            <option>رياض الأطفال / تأسيسي</option>
                            <option>المرحلة الابتدائية</option>
                            <option>المرحلة الإعدادية</option>
                            <option>المرحلة الثانوية العامة</option>
                            <option>المرحلة الأزهرية</option>
                            <option>المرحلة الجامعية</option>
                        </select>
                    </div>
                </div>
            </section>
        </div>

        <!-- TAB CONTENT 2: Teacher Portal -->
        <div id="content-teacher" class="tab-content space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-indigo-600">
                <h3 class="text-lg font-bold text-gray-800 mb-2">بوابة المعلمين</h3>
                <p class="text-sm text-gray-600">تسجيل الدخول وإدارة الفصول والمناهج الدراسية.</p>
            </div>
        </div>

        <!-- TAB CONTENT 3: Parent Portal -->
        <div id="content-parent" class="tab-content space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-purple-600">
                <h3 class="text-lg font-bold text-gray-800 mb-2">بوابة أولياء الأمور</h3>
                <p class="text-sm text-gray-600">متابعة تقارير حضور ومستوى الأبناء الدراسي.</p>
            </div>
        </div>

        <!-- TAB CONTENT 4: Admin Dashboard View -->
        <div id="content-admin" class="tab-content space-y-6 hidden">
            <section class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border-r-4 border-blue-500">
                    <p class="text-gray-500 text-xs font-semibold">إجمالي الطلاب</p>
                    <h3 class="text-2xl font-bold text-gray-800 mt-1">1,240</h3>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-r-4 border-green-500">
                    <p class="text-gray-500 text-xs font-semibold">إجمالي المعلمين</p>
                    <h3 class="text-2xl font-bold text-gray-800 mt-1">85</h3>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-r-4 border-purple-500">
                    <p class="text-gray-500 text-xs font-semibold">أولياء الأمور</p>
                    <h3 class="text-2xl font-bold text-gray-800 mt-1">410</h3>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-r-4 border-yellow-500">
                    <p class="text-gray-500 text-xs font-semibold">المحافظات النشطة</p>
                    <h3 class="text-2xl font-bold text-gray-800 mt-1">27 / 27</h3>
                </div>
            </section>
        </div>

    </main>

    <!-- JavaScript Control Functions -->
    <script>
        function switchTab(tabId) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(el => el.classList.add('hidden'));

            document.getElementById('tab-student').className = "flex-1 py-3 px-4 text-center font-bold text-sm text-gray-600 hover:text-indigo-600 transition flex items-center justify-center gap-2";
            document.getElementById('tab-teacher').className = "flex-1 py-3 px-4 text-center font-bold text-sm text-gray-600 hover:text-indigo-600 transition flex items-center justify-center gap-2";
            document.getElementById('tab-parent').className = "flex-1 py-3 px-4 text-center font-bold text-sm text-gray-600 hover:text-indigo-600 transition flex items-center justify-center gap-2";
            document.getElementById('nav-admin').className = "bg-yellow-500 hover:bg-yellow-600 text-indigo-950 px-3 py-1.5 rounded-lg text-sm font-bold transition flex items-center gap-1.5";

            if (tabId === 'admin') {
                document.getElementById('content-admin').classList.remove('hidden');
                document.getElementById('nav-admin').className = "bg-yellow-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold transition flex items-center gap-1.5 shadow-inner";
            } else {
                document.getElementById('content-' + tabId).classList.remove('hidden');
                const activeBtn = document.getElementById('tab-' + tabId);
                activeBtn.className = "flex-1 py-3 px-4 text-center font-bold text-sm text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50 transition flex items-center justify-center gap-2";
            }
        }
    </script>
</body>
    </html>
