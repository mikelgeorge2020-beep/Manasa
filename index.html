<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1e5bd8"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<title>منصة المجتهد</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b2033;--mut:#667;--pri:#3b5bdb;--bd:#dfe3ee;--ok:#2b8a3e;--bad:#c92a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12141c;--card:#1b1f2c;--tx:#e8eaf2;--mut:#9aa1b8;--pri:#7c93ff;--bd:#2d3347;--ok:#69db7c;--bad:#ff8787}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12141c;--card:#1b1f2c;--tx:#e8eaf2;--mut:#9aa1b8;--pri:#7c93ff;--bd:#2d3347;--ok:#69db7c;--bad:#ff8787}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.w{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:1.4rem;margin:8px 0 16px;text-align:center}h2{font-size:1.1rem;margin:14px 0 8px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ic{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px 12px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.ic .e{font-size:2.4rem;display:block}.ic b{display:block;margin-top:6px}.ic small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{white-space:nowrap}
button,.b{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 12px;cursor:pointer}
button.on,button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
input,select{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px;width:100%;min-width:0}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px;align-items:end}
label{font-size:.85rem;color:var(--mut);display:block}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--bd);padding:7px 6px;text-align:right;white-space:nowrap}th{color:var(--mut);font-weight:600}
.bd{background:var(--pri);color:#fff;border-radius:99px;padding:0 8px;font-size:.8rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
a{color:var(--pri)}
body{font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}:root{--pri:#1e5bd8;--acc:#f5a524}
