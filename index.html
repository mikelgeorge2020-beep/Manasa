function localDB(){
  const K="tp_",load=c=>{try{return JSON.parse(localStorage.getItem(K+c))||{}}catch(e){return{}}},save=(c,o)=>{try{localStorage.setItem(K+c,JSON.stringify(o))}catch(e){}},subs={};
  const snap=c=>({docs:Object.entries(load(c)).map(([id,d])=>({id,data:()=>d}))}),fire=c=>(subs[c]||[]).forEach(f=>f(snap(c)));
  const doc=(c,id)=>({set:async d=>{const o=load(c);o[id]=d;save(c,o);fire(c)},update:async d=>{const o=load(c);o[id]={...(o[id]||{}),...d};save(c,o);fire(c)},delete:async()=>{const o=load(c);delete o[id];save(c,o);fire(c)},get:async()=>{const d=load(c)[id];return{exists:!!d,id,data:()=>d}}});
  return{collection:c=>({onSnapshot:f=>{(subs[c]=subs[c]||[]).push(f);f(snap(c));return()=>{}},add:async d=>{const id="l"+Date.now()+Math.random().toString(36).slice(2,6);await doc(c,id).set(d);return doc(c,id)},doc:id=>doc(c,id)})}
}
const FAILS=new Set();
function bn(){const n=$("nb");if(FAILS.size){n.style.display="block";n.textContent="⚠️ لا توجد صلاحية قراءة: "+[...FAILS].join("، ")+" — راجع القواعد (Rules) في Firebase ثم Publish"}else if(/^⚠️ لا توجد صلاحية/.test(n.textContent))n.style.display="none"}
function sub(){unsubs.forEach(u=>u());unsubs=COLS.map(c=>db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));FAILS.delete(c);bn();rerender()},e=>{if(c==="notifs"&&S.role!=="admin")return;FAILS.add(c);bn()}))}
async function init(){
  try{if(FIREBASE_CONFIG.projectId){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();try{db.settings({experimentalAutoDetectLongPolling:true})}catch(_){}auth=firebase.auth();FB=true}}catch(e){db=null}
  if(!db){db=localDB();FB=false;$("nb").style.display="block";$("nb").textContent="⚠️ وضع تجريبي: لم يتم إدخال بيانات Firebase، لذلك البيانات تُحفظ على هذا الجهاز فقط."}
  else{render();try{try{await auth.setPersistence(firebase.auth.Auth.Persistence.NONE)}catch(_){}if(!auth.currentUser)await Promise.race([auth.signInAnonymously(),new Promise((_,r)=>setTimeout(()=>r({code:"timeout"}),15000))])}catch(e){const n=$("nb");n.style.display="block";n.textContent=e.code==="timeout"?"⚠️ تعذر الاتصال بـ Firebase (انتهت المهلة). افتح رابط المنصة مباشرة في المتصفح وليس داخل معاينة أخرى، وتأكد من الإنترنت.":"⚠️ فعّل تسجيل الدخول المجهول (Anonymous) في Firebase Authentication ("+(e.code||"")+")"}}
  if(FB){auth.onAuthStateChanged(u=>{if(u)sub()})}else sub();
  render();
}
function rerender(){if(["teacherLogin","adminLogin","parentLogin"].includes(S.role))return;const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)){pending=true;return}render()}
document.addEventListener("focusout",()=>{if(pending)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|SELECT/.test(a.tagName))){pending=false;render()}},50)});
const add=(c,o)=>db.collection(c).add({...o,ts:Date.now()}).catch(()=>alert("تعذر الحفظ"));
const del=(c,id)=>{if(confirm("تأكيد الحذف؟"))db.collection(c).doc(id).delete()};

function go(role,tab){S.role=role;S.tab=tab;S.err="";render()}
function out(){S.role=null;S.me=null;S.tab=null;render();if(FB&&auth.currentUser&&!auth.currentUser.isAnonymous)auth.signOut().then(()=>auth.signInAnonymously()).then(sub).catch(()=>{})}
function render(){
  const A=$("app");
  if(!db){A.innerHTML=`<h1>🎓 منصة المدرسين</h1><div class="card">يلزم فتح الصفحة وأنت مسجّل الدخول في Claude لتعمل قاعدة البيانات المشتركة.</div>`;return}
  if(!S.role){A.innerHTML=`<div class="hero"><div class="logo">🏆</div><h1>منصة المجتهد</h1><p>تعلّم.. اجتهد.. تفوّق</p></div><div class="g3">
  <button class="ic c1" onclick="go('adminLogin')"><span class="e">🛡️</span><b>الإدارة</b><small>دخول الأدمن</small></button>
  <button class="ic c2" onclick="go('teacherLogin')"><span class="e">👨‍🏫</span><b>المدرس</b><small>تسجيل / دخول</small></button>
  <button class="ic c3" onclick="go('parentLogin')"><span class="e">👪</span><b>ولي الأمر</b><small>بكود الطالب</small></button>
  <button class="ic c4" onclick="go('stages')"><span class="e">🎓</span><b>المراحل التعليمية</b><small>تصفّح المدرسين</small></button></div>${adSlot("home")}`;return}

  if(S.role==="teacherLogin"){A.innerHTML=`<div class="top"><h1>المدرس</h1>${back}</div>
  <div class="card"><h2>دخول</h2><label>رقم الهاتف</label><input id="lph" type="tel" autocomplete="off"><br><br><label>كلمة المرور</label><input id="lpw" type="password" autocomplete="new-password"><p class="bad">${h(S.err)}</p><button class="p" onclick="teacherIn()">دخول</button></div>
  <div class="card"><h2>تسجيل مدرس جديد</h2><div class="fr">
  <div><label>الاسم</label><input id="rn"></div><div><label>رقم الهاتف</label><input id="rp" type="tel" autocomplete="off"></div>
  <div><label>المحافظة</label><select id="rg">${opt(GOV)}</select></div>
  <div><label>سنوات الخبرة</label><input id="rx" type="number" min="0"></div><div><label>كلمة مرور (6 أحرف على الأقل)</label><input id="rpw" type="password" autocomplete="new-password"></div></div><label>المراحل والتخصصات</label><div id="trows">${rowHtml()}</div><button type="button" onclick="addRow()">➕ إضافة مرحلة أخرى</button><br><br><button class="p" onclick="register()">تسجيل</button></div>`;return}

async function adminIn(){
  if(!FB){if(v("apw")===ADMIN_PIN)go("admin","r");else{S.err="رقم سري خاطئ";render()}return}
  try{const c=await auth.signInWithEmailAndPassword(v("aem").trim(),v("apw"));
    if(c.user.email!==ADMIN_EMAIL){await auth.signInAnonymously();S.err="هذا الحساب ليس حساب الإدارة";return render()}
    sub();go("admin","r")}catch(e){S.err="بيانات الدخول غير صحيحة";render()}}
function parentIn(){const c=v("code").trim().toUpperCase(),s=D.students.find(x=>x.code===c);if(s){S.me=s;go("parent")}else{S.err="كود غير صحيح";render()}}
async function teacherIn(){
  const p=v("lph").replace(/\D/g,""),pw=v("lpw");
  try{
    if(FB){await auth.signInWithEmailAndPassword(p+"@teacher.local",pw);sub()}
    const d=await db.collection("teachers").doc(p).get(),t=d.exists?{id:d.id,...d.data()}:null;
    if(!t)S.err="رقم غير مسجل";else if(t.status==="pending")S.err="حسابك بانتظار موافقة الإدارة";else if(t.status==="rejected")S.err="تم رفض طلب التسجيل، تواصل مع الإدارة";else if(t.status==="suspended")S.err="تم إيقاف الحساب، تواصل مع الإدارة";else{S.me=t.id;return go("teacher","s")}
  }catch(e){S.err="رقم الهاتف أو كلمة المرور غير صحيحة"}
  render()}
async function register(){
  const ph=v("rp").replace(/\D/g,""),pw=v("rpw");
  const TR=[...document.querySelectorAll(".trow")].map(r=>({stage:r.querySelector(".rst").value,subject:r.querySelector(".rsb").value})).filter((x,i,a)=>a.findIndex(y=>y.stage===x.stage&&y.subject===x.subject)===i);
  const o={name:v("rn").trim(),phone:ph,gov:v("rg"),exp:N(v("rx")),teachings:TR,stages:[...new Set(TR.map(x=>x.stage))],subject:[...new Set(TR.map(x=>x.subject))].join("، "),status:"pending"};
  if(!o.name||!ph)return alert("أدخل الاسم ورقم الهاتف");
  if(!o.stages.length)return alert("اختر مرحلة تعليمية واحدة على الأقل");
  if(FB&&pw.length<6)return alert("كلمة المرور 6 أحرف على الأقل");
  if(!FB&&D.teachers.some(t=>t.phone===ph))return alert("الرقم مسجل بالفعل");
  let step="";const T=(p,l)=>{step=l;return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:"timeout"}),15000))])};
  try{
    if(FB){
      try{await T(auth.createUserWithEmailAndPassword(ph+"@teacher.local",pw),"إنشاء الحساب")}
      catch(e){
        if(e.code!=="auth/email-already-in-use")throw e;
        try{await T(auth.signInWithEmailAndPassword(ph+"@teacher.local",pw),"تسجيل الدخول")}catch(_){return alert("الرقم مسجل بالفعل. تأكد من كلمة المرور أو تواصل مع الإدارة")}
        const ex=await T(db.collection("teachers").doc(ph).get(),"قراءة البيانات");
        if(ex.exists)return alert("الرقم مسجل بالفعل، ادخل من خانة دخول")
      }
    }
    await T(db.collection("teachers").doc(ph).set({...o,ts:Date.now()}),"حفظ بيانات المدرس");
    await T(add("notifs",{text:`مدرس جديد سجّل: ${o.name} - ${o.subject} - ${o.gov} - ${ph}`,read:false}),"حفظ الإشعار");
  }catch(e){return alert(e.code==="timeout"?"تعذر الاتصال عند خطوة: "+step+"\nجرّب شبكة أخرى ثم أعد المحاولة":"تعذر التسجيل: "+(e.code||e.message||""))}
  alert("تم إرسال طلبك بنجاح، وسيتم تفعيل حسابك بعد موافقة الإدارة.");out();
}
